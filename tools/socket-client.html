<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Socket.IO Device Simulator</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body { max-width: 760px; margin: 40px auto; padding: 0 16px; font-family: system-ui, sans-serif; }
      label { display: block; margin-top: 12px; }
      input, button { box-sizing: border-box; padding: 10px; margin-top: 4px; }
      input { width: 100%; }
      button { cursor: pointer; }
      pre { min-height: 240px; padding: 12px; overflow: auto; background: #111; color: #d8ffd8; }
    </style>
  </head>
  <body>
    <h1>Socket.IO Device Simulator</h1>
    <label>
      Server URL
      <input id="serverUrl" value="http://localhost:3000" />
    </label>
    <label>
      Device ID
      <input id="deviceId" value="BS26031001" />
    </label>
    <button id="connectButton" type="button">Connect dan join device</button>
    <pre id="output">Belum terhubung.</pre>

    <script>
      //===== (DOM References) ======
      const output = document.getElementById("output");

      //===== (writeLog) ======
      const writeLog = (label, value) => {
        const detail = typeof value === "string" ? value : JSON.stringify(value, null, 2);
        output.textContent += `\n[${new Date().toISOString()}] ${label}: ${detail}`;
      };

      //===== (Connect Button Handler) ======
      document.getElementById("connectButton").addEventListener("click", () => {
        output.textContent = "Menghubungkan...";
        const serverUrl = document.getElementById("serverUrl").value.trim();
        const deviceId = document.getElementById("deviceId").value.trim();
        const socket = io(serverUrl);

        socket.on("connect", () => {
          writeLog("connected", socket.id);
          socket.emit("join_device", deviceId);
          writeLog("join_device", deviceId);
        });

        socket.on("mqtt_message", (data) => {
          writeLog("mqtt_message", data);
        });

        socket.on("connect_error", (error) => {
          writeLog("connect_error", error.message);
        });

        socket.on("disconnect", (reason) => {
          writeLog("disconnect", reason);
        });
      });
    </script>
  </body>
</html>
